; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
boards_dir = ./boards
extra_configs =
    ; place your global library dependencies here, it will use in all envs
    extra_configs/lib_deps.ini
    ; base envs to extend from, e.g. for different board variants
    extra_configs/base_envs.ini
    ; place extra configuration options here, you can reuse in other envs via ${extra.config_name}
    extra_configs/extra.ini
    ; set OTA auth and IP!
    extra_configs/ota.ini

; uncomment to build an example
; src_dir = ./examples/blink
; src_dir = ./examples/low-energy-consumption
; src_dir = ./examples/esp-now-le
; src_dir = ./examples/serial
; src_dir = ./examples/button
; src_dir = ./examples/mac
; src_dir = ./examples/rgb
; src_dir = ./examples/wifi-ap
; src_dir = ./examples/ota
; src_dir = ./examples/ota-telnet
; src_dir = ./examples/ota-webserver
; src_dir = ./examples/ota-manager-rtos
; src_dir = ./examples/i2c-scan
; src_dir = ./examples/i2c-bme-280

[env]
; see pioarduino versions: https://github.com/pioarduino/platform-espressif32/releases
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
extra_scripts = pre:extra_script.py
framework = arduino
build_flags =
    ; to use e.g. as part of the firmware name 
    '-DPIOENV="${PIOENV}"'
 
    ; debug level 5=VERBOSE https://docs.platformio.org/en/latest/platforms/espressif32.html#debug-level
    ;  -DCORE_DEBUG_LEVEL=5

    ; DebugUtils with serial output. Comment out to silence debug outputs.
    -DSERIAL_DEBUG
monitor_speed = 115200
; uncomment when using multiple ESPs
; monitor_port = /dev/cu.usbmodem5
upload_speed = 921600
; uncomment and configure when you have multiple ESPs connected
; upload_port = /dev/tty.usbserial-...
; monitor_port = /dev/tty.usbserial-...

; ************
; * ESP32-C6 *
; ************
; devkitc-1: https://docs.espressif.com/projects/espressif-esp-dev-kits/en/latest/esp32c6/esp32-c6-devkitc-1/index.html
; devkitm-1: https://docs.espressif.com/projects/espressif-esp-dev-kits/en/latest/esp32c6/esp32-c6-devkitm-1/index.html

[env:esp32-c6-n16]
extends = esp32c6
board = esp32-c6-n16

[env:esp32-c6-n16-ota]
extends = esp32c6-ota
board = esp32-c6-n16

[env:esp32-c6-n4]
extends = esp32c6
board = esp32-c6-n4

[env:esp32-c6-n4-ota]
extends = esp32c6-ota
board = esp32-c6-n4
