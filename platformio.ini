; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
boards_dir = ./boards
extra_configs = upload_params.ini
; uncomment to build an example
; src_dir = ./examples/blink
;src_dir = ./examples/low-energy-consumption
; src_dir = ./examples/esp-now-le
; src_dir = ./examples/serial
; src_dir = ./examples/mac
; src_dir = ./examples/rgb
; src_dir = ./examples/wifi-ap
; src_dir = ./examples/ota
; src_dir = ./examples/ota-telnet
; src_dir = ./examples/ota-webserver
; src_dir = ./examples/ota-manager-rtos

[env]
build_flags =
    ; to use e.g. as part of the firmware name 
    '-DPIOENV="${PIOENV}"'
 
    ; coding_standards
    -Wno-unused-variable
    -Wno-unused-but-set-variable
    -Wunreachable-code

    ; debug level 5=VERBOSE https://docs.platformio.org/en/latest/platforms/espressif32.html#debug-level
    ;  -DCORE_DEBUG_LEVEL=5
extra_scripts = pre:extra_script.py
framework = arduino
lib_deps =
    ; place global libs here or under extra.lib_deps_external (see below)
monitor_speed = 115200
; see pioarduino versions: https://github.com/pioarduino/platform-espressif32/releases
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
; uncomment when using multiple ESPs
; monitor_port = /dev/cu.usbmodem5
upload_speed = 921600
; uncomment and configure when you have multiple ESPs connected
; upload_port = /dev/tty.usbserial-...
; monitor_port = /dev/tty.usbserial-...

; CUSTOM options
; You need manually inject these options into a section
; using ${extra.<name_of_option>} (see below)
[extra]
; https://docs.espressif.com/projects/esp-idf/en/latest/esp32/api-guides/external-ram.html
build_flags_psram =
    -DBOARD_HAS_PSRAM=1
    -mfix-esp32-psram-cache-issue ; https://docs.espressif.com/projects/esp-idf/en/latest/esp32/api-guides/external-ram.html#esp32-rev-v1
lib_deps_builtin =
  SPI
  Wire
  I2C
  ; FS
lib_deps_external =
    adafruit/Adafruit NeoPixel @ ^1.12.0
	lennarthennigs/ESP Telnet @ ^2.2.1
	; me-no-dev/ESPAsyncTCP @ ^1.2.2
	; me-no-dev/ESP Async WebServer @ ^1.2.3
    ; extend libs for all platforms here

[esp32]
build_flags =
    ${env.build_flags}
lib_deps =
    ${env.lib_deps}
    ${extra.lib_deps_builtin}
    ${extra.lib_deps_external}
    ; extend libs only for esp32 based modules here

[esp32c6]
build_flags =
    ${env.build_flags}
lib_deps =
    ${env.lib_deps}
    ${extra.lib_deps_builtin}
    ${extra.lib_deps_external}
    ; extend libs only for esp32c6 based modules here
; Use pioarduino, a community compatible fork of Platformio supporting latest espressif Arduino core
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip

[esp32s2]
build_flags =
    ${env.build_flags}
lib_deps =
    ${env.lib_deps}
    ${extra.lib_deps_builtin}
    ${extra.lib_deps_external}
    ; extend libs only for esp32s2 based modules here

[esp32s3]
build_flags =
    ${env.build_flags}
lib_deps =
    ${env.lib_deps}
    ${extra.lib_deps_builtin}
    ${extra.lib_deps_external}
    ; extend libs only for esp32s3 based modules here

; ************
; * ESP32-C6 *
; ************
; devkitc-1: https://docs.espressif.com/projects/espressif-esp-dev-kits/en/latest/esp32c6/esp32-c6-devkitc-1/index.html
; devkitm-1: https://docs.espressif.com/projects/espressif-esp-dev-kits/en/latest/esp32c6/esp32-c6-devkitm-1/index.html

[esp32c6-ota]
upload_speed = 2000000
upload_protocol = espota
; change upload_port after connected to your network instead of the ESP AP
; upload_port = 192.168.4.1
upload_port = 192.168.50.105

[env:esp32-c6-n16]
extends = esp32c6
board = esp32-c6-n16

[env:esp32-c6-n16-ota]
extends = env:esp32-c6-n16
upload_speed = ${esp32c6-ota.upload_speed}
upload_protocol = ${esp32c6-ota.upload_protocol}
upload_port = ${esp32c6-ota.upload_port}

[env:esp32-c6-n4]
extends = esp32c6
board = esp32-c6-n4

[env:esp32-c6-n4-ota]
extends = env:esp32-c6-n4
upload_speed = ${esp32c6-ota.upload_speed}
upload_protocol = ${esp32c6-ota.upload_protocol}
upload_port = ${esp32c6-ota.upload_port}
